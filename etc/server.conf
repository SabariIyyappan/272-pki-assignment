# TLS server certificate request (Member 3)
# Based on the Simple PKI tutorial's etc/server.conf.
# The SAN below is copied into the certificate by the Signing CA (copy_extensions = copy).

[ req ]
default_bits            = 2048                  # RSA key size
encrypt_key             = yes                   # Protect private key
default_md              = sha256                # MD to use
utf8                    = yes                   # Input is UTF-8
string_mask             = utf8only              # Emit UTF-8 strings
prompt                  = no                    # Take DN from config, no prompting
distinguished_name      = server_dn
req_extensions          = server_reqext

[ server_dn ]
0.domainComponent       = "org"
1.domainComponent       = "simple"
organizationName        = "Simple Inc"          # must match the Signing CA (match_pol)
organizationalUnitName  = "Simple Web Server"
commonName              = "localhost"

[ server_reqext ]
keyUsage                = critical,digitalSignature,keyEncipherment
extendedKeyUsage        = serverAuth,clientAuth
subjectKeyIdentifier    = hash
subjectAltName          = @alt_names

[ alt_names ]
DNS.1                   = localhost
IP.1                    = 127.0.0.1
